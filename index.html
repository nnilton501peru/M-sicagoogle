<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0c">
    <title>Mauricio · Reproductor Público</title>
    <meta name="application-version" content="26">
    <script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <style>
        :root {
            --accent: #00ff88;
            --bg: #0a0a0c;
            --surface: #15151a;
            --surface2: #1f1f27;
            --text: #f2f2f5;
            --muted: #8b8b99;
            --glow: #1d1d26;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); accent-color: var(--accent); }
        button, input { font-family: inherit; }
        .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; flex-shrink: 0; flex-wrap: wrap; row-gap: 12px; }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: #000; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        h1 { font-size: 17px; font-weight: 700; }
        #count { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .tools { display: flex; gap: 6px; width: 100%; justify-content: space-between; }
        .ib { width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--surface2); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .ib:active { transform: scale(0.92); }
        input[type="file"] { display: none; }
        .search { position: relative; margin: 0 16px 10px; flex-shrink: 0; }
        #search { width: 100%; padding: 12px 14px 12px 42px; border: none; border-radius: 14px; background: var(--surface); color: var(--text); font-size: 15px; outline: none; }
        .list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; }
        .row { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border-radius: 12px; cursor: pointer; }
        .row:active { background: var(--surface2); }
        .name { flex: 1; min-width: 0; font-size: 15px; color: #d4d4dc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .row.active .name { color: var(--accent); font-weight: 600; }
        .modal-backdrop { position: fixed; inset: 0; z-index: 450; display: none; align-items: center; justify-content: center; padding: 20px; background: #0009; backdrop-filter: blur(8px); }
        .modal-backdrop.open { display: flex; }
        .premium-modal { width: min(100%, 360px); padding: 22px; border: 1px solid var(--accent); border-radius: 24px; background: var(--surface); color: var(--text); }
        .client-input { width: 100%; padding: 12px; border: 1px solid var(--surface2); border-radius: 12px; background: var(--bg); color: var(--text); font-size: 14px; margin-bottom: 12px; outline: none; }
        .modal-save { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 12px; font-weight: 750; cursor: pointer; }
    </style>
</head>
<body>
<header class="top">
    <div class="brand">
        <div class="logo">♪</div>
        <div>
            <h1>Mauricio</h1>
            <p id="count">Conecta tu API Key</p>
        </div>
    </div>
    <div class="tools">
        <button class="ib" onclick="openConfigModal()" title="Configurar API Key">⚙️</button>
        <button class="ib" onclick="loadDriveFiles()" title="Conectar Drive">☁️</button>
    </div>
</header>
<main class="list" id="list">
    <div style="text-align:center; padding: 40px; color: #8b8b99;">
        <b>Reproductor Listo</b><br>Toca la ⚙️ para guardar tu API Key y listar "full música".
    </div>
</main>

<div class="modal-backdrop" id="configModal">
  <div class="premium-modal">
    <h2>Configurar API Key</h2>
    <p style="color:var(--muted); font-size:13px; margin: 10px 0;">Pega tu clave de Google Cloud:</p>
    <input type="text" id="apiKeyInput" class="client-input" placeholder="AIzaSy...">
    <button class="modal-save" onclick="saveApiKey()">Guardar</button>
  </div>
</div>

<script>
    const FOLDER_ID = '0B_fjnoyvEhIhS0NuLTJxM3liYmc';
    let apiKey = localStorage.getItem('api_key') || '';
    
    function openConfigModal() {
        document.getElementById('apiKeyInput').value = apiKey;
        document.getElementById('configModal').classList.add('open');
    }
    
    function saveApiKey() {
        apiKey = document.getElementById('apiKeyInput').value.trim();
        localStorage.setItem('api_key', apiKey);
        document.getElementById('configModal').classList.remove('open');
        if (apiKey) loadDriveFiles();
    }

    async function loadDriveFiles() {
        if (!apiKey) { openConfigModal(); return; }
        try {
            const res = await fetch(`https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents&key=${apiKey}`);
            const data = await res.json();
            if (data.files) {
                document.getElementById('count').textContent = data.files.length + ' canciones';
                document.getElementById('list').innerHTML = data.files.map(f => `<div class="row"><div class="name">${f.name}</div></div>`).join('');
            } else {
                alert('Revisa tu API Key o permisos.');
            }
        } catch(e) { alert('Error de red.'); }
    }
    if (apiKey) loadDriveFiles();
</script>
</body>
</html>
